server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:nacos:common.yaml
  cloud:
    nacos:
      # 配置中心与服务发现共用一套地址与账号
      server-addr: 192.168.10.114:8848
      username: nacos
      password: nacos2026
    gateway:
      routes:
        - id: UserSystem
          uri: lb://user-service
          predicates:
            - Path=/api/userservice/**
        - id: CloudDiskSystem
          uri: lb://cloud-disk-service
          predicates:
            - Path=/api/clouddisksystem/**

sw:
  auth:
    excludePaths:
      - /api/userservice/public/**
      - /api/clouddisksystem/public/**
    # 系统标识（app_key）→ 路径前缀（Ant 风格）映射，用于校验 token 的 app_key 与路由匹配
    app-route-mapping:
      UserSystem:
        - /api/userservice/**
        - /api/clouddisksystem/**
